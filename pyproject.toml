[project]
name = "landslide-ews"
version = "0.1.0"
description = "Early warning and landslide risk monitoring for the North Eastern Region"
requires-python = ">=3.11"
dependencies = [
    # geospatial
    "rasterio>=1.3", "geopandas>=1.0", "shapely>=2.0", "pyproj>=3.6",
    "xarray>=2024.1", "rioxarray>=0.15", "whitebox>=2.3", "osmnx>=2.0",
    # earth observation
    "earthengine-api>=1.0", "google-auth-oauthlib>=1.2", "geemap>=0.32", "asf-search>=7.0",
    # machine learning
    "xgboost>=2.0", "scikit-learn>=1.4", "torch>=2.2",
    "ruptures>=1.1", "shap>=0.45", "imbalanced-learn>=0.12",
    # data
    "pandas>=2.2", "numpy>=1.26",
    "psycopg[binary]>=3.1", "sqlalchemy>=2.0", "geoalchemy2>=0.15", "alembic>=1.13",
    # api
    "fastapi>=0.110", "uvicorn[standard]>=0.29", "pydantic-settings>=2.2", "redis>=5.0",
    # orchestration and tracking
    "prefect>=3.0", "mlflow>=2.12",
    # utils
    "python-dotenv>=1.0", "httpx>=0.27", "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov", "ruff>=0.4", "mypy>=1.10", "ipykernel", "jupyterlab"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ingestion", "processing", "models", "api", "alerting"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running tests (InSAR, full hindcast)"]
